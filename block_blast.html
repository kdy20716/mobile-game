<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast: Elemental</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .grid-cell {
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .grid-cell.highlight {
      background-color: rgba(255, 255, 255, 0.4) !important;
      transform: scale(0.92);
    }
    .grid-cell.clearing {
      animation: clearPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes clearPop {
      0% { transform: scale(1); filter: brightness(1.8); }
      50% { transform: scale(1.25); filter: brightness(2.5); }
      100% { transform: scale(0); opacity: 0; }
    }
    .combo-banner {
      animation: comboFloat 0.8s ease-out forwards;
    }
    @keyframes comboFloat {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      70% { transform: translate(-50%, -60%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -80%) scale(0.9); opacity: 0; }
    }
    .shake {
      animation: shakeScreen 0.25s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shakeScreen {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }
    .dragged-item {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 select-none">

  <!-- Header: Score & Best Score & Skills -->
  <header class="w-full max-w-md flex flex-col gap-2 pt-2">
    <div class="flex items-center justify-between px-2">
      <div class="flex flex-col">
        <span class="text-xs font-semibold text-slate-400 tracking-wider">SCORE</span>
        <span id="currentScore" class="text-3xl font-black text-amber-400 drop-shadow">0</span>
      </div>
      
      <!-- Logo -->
      <div class="text-center">
        <h1 class="text-lg font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-amber-400">
          BLOCK BLAST
        </h1>
        <span class="text-[10px] uppercase font-bold tracking-widest text-cyan-400">ELEMENTAL</span>
      </div>

      <div class="flex flex-col items-end">
        <span class="text-xs font-semibold text-slate-400 tracking-wider">BEST</span>
        <span id="bestScore" class="text-3xl font-black text-slate-200">0</span>
      </div>
    </div>

    <!-- Skills Bar (Differentiators!) -->
    <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl px-4 py-2 mt-1">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-slate-300">FEVER</span>
        <div class="w-28 h-3.5 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700">
          <div id="feverBar" class="h-full bg-gradient-to-r from-amber-500 via-rose-500 to-purple-500 rounded-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Hammer Skill -->
        <button id="btnHammer" class="relative px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 flex items-center gap-1.5 transition-all">
          <span class="text-base">🔨</span>
          <span class="text-xs font-bold text-amber-300">SMASH</span>
          <span id="hammerBadge" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-rose-600 text-[10px] font-black rounded-full flex items-center justify-center border border-slate-900">1</span>
        </button>
        <!-- Rotate Skill -->
        <button id="btnRotate" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 flex items-center gap-1.5 transition-all">
          <span class="text-base">🔄</span>
          <span class="text-xs font-bold text-cyan-300">TURN</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Game Board Container -->
  <main id="boardContainer" class="relative w-full max-w-md aspect-square p-2 bg-slate-900/80 rounded-2xl border-2 border-slate-800/80 shadow-2xl flex items-center justify-center my-auto">
    <div id="gridBoard" class="w-full h-full grid grid-cols-8 grid-rows-8 gap-1.5 p-1 bg-slate-950/70 rounded-xl">
      <!-- 64 cells generated by JS -->
    </div>

    <!-- Combo Popup Overlay -->
    <div id="comboOverlay" class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden"></div>
  </main>

  <!-- Bottom: 3 Hand Blocks -->
  <footer class="w-full max-w-md pb-4 pt-1">
    <div id="handSlots" class="grid grid-cols-3 gap-3 h-28 items-center justify-items-center bg-slate-900/60 border border-slate-800/60 rounded-2xl p-2">
      <!-- 3 Draggable Blocks will be rendered here -->
    </div>
    <div class="text-center mt-2">
      <span class="text-[11px] font-medium text-slate-500">블록을 보드로 드래그해 가로/세로 라인을 터뜨리세요! 🧨폭탄 연쇄 폭발</span>
    </div>
  </footer>

  <!-- Game Over Modal -->
  <div id="gameOverModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl animate-fade-in">
      <div class="w-16 h-16 bg-rose-600/20 text-rose-500 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 border border-rose-500/30">
        💥
      </div>
      <h2 class="text-2xl font-black text-slate-100">NO MORE MOVES</h2>
      <p class="text-xs text-slate-400 mt-1 mb-5">더 이상 블록을 둘 곳이 없습니다!</p>

      <div class="bg-slate-950/60 rounded-2xl p-4 border border-slate-800 mb-6 flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-400">FINAL SCORE</span>
          <span id="modalFinalScore" class="text-2xl font-black text-amber-400">0</span>
        </div>
        <div class="flex justify-between items-center border-t border-slate-800/80 pt-2">
          <span class="text-xs font-bold text-slate-400">BEST RECORD</span>
          <span id="modalBestScore" class="text-lg font-black text-slate-300">0</span>
        </div>
      </div>

      <button id="btnRestart" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-400 hover:to-rose-400 active:scale-95 text-slate-950 font-black text-base rounded-2xl shadow-lg shadow-rose-500/25 transition-all">
        PLAY AGAIN
      </button>
    </div>
  </div>

  <!-- Audio Synthesis & Game Logic Script -->
  <script>
    // --- Procedural Web Audio Engine (No external sound files needed!) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'sine', duration = 0.12, gainVal = 0.15) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      playPickup() {
        this.init();
        this.playTone(320, 'sine', 0.08, 0.1);
      }
      playPlace() {
        this.init();
        this.playTone(220, 'triangle', 0.1, 0.2);
      }
      playClear(comboCount = 1) {
        this.init();
        const baseFreqs = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99]; // C Pentatonic Scale
        const note = baseFreqs[Math.min(comboCount - 1, baseFreqs.length - 1)];
        this.playTone(note, 'triangle', 0.25, 0.3);
        setTimeout(() => this.playTone(note * 1.5, 'sine', 0.3, 0.2), 60);
      }
      playBomb() {
        this.init();
        if (!this.ctx) return;
        try {
          // Low boom noise simulation
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
          gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.45);
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    // --- Block Shapes & Color Palette ---
    const COLORS = [
      { bg: '#38bdf8', border: '#0284c7' }, // Cyan
      { bg: '#f59e0b', border: '#d97706' }, // Amber
      { bg: '#ec4899', border: '#db2777' }, // Pink
      { bg: '#10b981', border: '#059669' }, // Emerald
      { bg: '#8b5cf6', border: '#7c3aed' }, // Purple
      { bg: '#ef4444', border: '#dc2626' }, // Red (Bomb)
    ];

    const SHAPES = [
      // 1x1 Dot
      { matrix: [[1]], name: 'dot' },
      // Bars (2, 3, 4, 5)
      { matrix: [[1, 1]], name: 'bar2' },
      { matrix: [[1], [1]], name: 'bar2_v' },
      { matrix: [[1, 1, 1]], name: 'bar3' },
      { matrix: [[1], [1], [1]], name: 'bar3_v' },
      { matrix: [[1, 1, 1, 1]], name: 'bar4' },
      { matrix: [[1], [1], [1], [1]], name: 'bar4_v' },
      // Squares
      { matrix: [[1, 1], [1, 1]], name: 'sq2' },
      { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], name: 'sq3' },
      // Corners
      { matrix: [[1, 1], [1, 0]], name: 'corner1' },
      { matrix: [[1, 1], [0, 1]], name: 'corner2' },
      { matrix: [[1, 0], [1, 1]], name: 'corner3' },
      { matrix: [[0, 1], [1, 1]], name: 'corner4' },
      // Large L
      { matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], name: 'L_large' },
      { matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], name: 'J_large' },
      // T Shapes
      { matrix: [[1, 1, 1], [0, 1, 0]], name: 'T' },
      { matrix: [[0, 1, 0], [1, 1, 1]], name: 'T_inv' },
    ];

    // --- Game State Variables ---
    const GRID_SIZE = 8;
    let board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
    let hand = [null, null, null];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('block_blast_best') || '0', 10);
    let combo = 0;
    let fever = 0;
    let hammerCount = 1;
    let isHammerActive = false;

    // --- DOM Elements ---
    const gridBoardEl = document.getElementById('gridBoard');
    const handSlotsEl = document.getElementById('handSlots');
    const currentScoreEl = document.getElementById('currentScore');
    const bestScoreEl = document.getElementById('bestScore');
    const feverBarEl = document.getElementById('feverBar');
    const hammerBadgeEl = document.getElementById('hammerBadge');
    const btnHammer = document.getElementById('btnHammer');
    const btnRotate = document.getElementById('btnRotate');
    const gameOverModal = document.getElementById('gameOverModal');
    const modalFinalScore = document.getElementById('modalFinalScore');
    const modalBestScore = document.getElementById('modalBestScore');
    const btnRestart = document.getElementById('btnRestart');
    const comboOverlay = document.getElementById('comboOverlay');
    const boardContainer = document.getElementById('boardContainer');

    bestScoreEl.textContent = bestScore;

    // --- Initialize 8x8 Board UI ---
    function initBoardUI() {
      gridBoardEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell rounded-md bg-slate-900 border border-slate-800/80 flex items-center justify-center cursor-pointer select-none';
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          cell.addEventListener('click', () => onCellClick(r, c));
          gridBoardEl.appendChild(cell);
        }
      }
      renderBoard();
    }

    function renderBoard() {
      const cells = gridBoardEl.children;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const idx = r * GRID_SIZE + c;
          const cell = cells[idx];
          const data = board[r][c];

          if (data) {
            cell.style.backgroundColor = data.color.bg;
            cell.style.borderColor = data.color.border;
            cell.innerHTML = data.isBomb ? '<span class="text-xs">🧨</span>' : '';
          } else {
            cell.style.backgroundColor = '';
            cell.style.borderColor = '';
            cell.innerHTML = '';
          }
          cell.classList.remove('highlight', 'clearing');
        }
      }
    }

    // --- Spawn Hand Blocks ---
    function spawnHand() {
      for (let i = 0; i < 3; i++) {
        if (!hand[i]) {
          const shapeProto = SHAPES[Math.floor(Math.random() * SHAPES.length)];
          const color = COLORS[Math.floor(Math.random() * (COLORS.length - 1))];
          
          // 15% chance to be an Elemental Bomb block!
          const isBomb = Math.random() < 0.15;
          const blockColor = isBomb ? COLORS[COLORS.length - 1] : color;

          hand[i] = {
            matrix: shapeProto.matrix.map(row => [...row]),
            color: blockColor,
            isBomb: isBomb
          };
        }
      }
      renderHand();
      checkGameOver();
    }

    function renderHand() {
      handSlotsEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const slot = document.createElement('div');
        slot.className = 'w-full h-full flex items-center justify-center relative';

        const item = hand[i];
        if (item) {
          const blockEl = createBlockElement(item, i);
          slot.appendChild(blockEl);
        }
        handSlotsEl.appendChild(slot);
      }
    }

    function createBlockElement(item, slotIndex) {
      const rows = item.matrix.length;
      const cols = item.matrix[0].length;

      const container = document.createElement('div');
      container.className = 'cursor-grab active:cursor-grabbing p-1 transition-transform hover:scale-105';
      container.style.display = 'grid';
      container.style.gridTemplateRows = `repeat(${rows}, 20px)`;
      container.style.gridTemplateColumns = `repeat(${cols}, 20px)`;
      container.style.gap = '2.5px';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const bit = item.matrix[r][c];
          const cell = document.createElement('div');
          if (bit) {
            cell.className = 'rounded-md shadow-sm flex items-center justify-center text-[10px]';
            cell.style.backgroundColor = item.color.bg;
            cell.style.border = `1.5px solid ${item.color.border}`;
            if (item.isBomb && r === 0 && c === 0) cell.textContent = '🧨';
          } else {
            cell.style.opacity = '0';
          }
          container.appendChild(cell);
        }
      }

      setupDragAndDrop(container, item, slotIndex);
      return container;
    }

    // --- Drag & Drop Mechanics (Mobile & Mouse) ---
    let activeDrag = null;

    function setupDragAndDrop(element, item, slotIndex) {
      element.addEventListener('pointerdown', (e) => {
        if (isHammerActive) return;
        e.preventDefault();
        sound.playPickup();

        const rect = element.getBoundingClientRect();
        const clone = element.cloneNode(true);
        clone.classList.add('dragged-item');
        document.body.appendChild(clone);

        // Adjust scale for visual clarity during drag
        clone.style.transform = 'translate(-50%, -75%) scale(1.15)';

        activeDrag = {
          element: clone,
          source: element,
          item: item,
          slotIndex: slotIndex,
          rows: item.matrix.length,
          cols: item.matrix[0].length
        };

        element.style.opacity = '0.2';
        updateDragPosition(e.clientX, e.clientY);

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      });
    }

    function onPointerMove(e) {
      if (!activeDrag) return;
      updateDragPosition(e.clientX, e.clientY);
      updatePlacementPreview(e.clientX, e.clientY);
    }

    function updateDragPosition(x, y) {
      if (!activeDrag) return;
      // -50px touch offset so finger never covers the block!
      activeDrag.element.style.left = `${x}px`;
      activeDrag.element.style.top = `${y - 50}px`;
    }

    function getGridCellFromPoint(x, y) {
      const targetY = y - 50; // match touch offset
      const boardRect = gridBoardEl.getBoundingClientRect();

      if (x < boardRect.left || x > boardRect.right || targetY < boardRect.top || targetY > boardRect.bottom) {
        return null;
      }

      const cellWidth = boardRect.width / GRID_SIZE;
      const cellHeight = boardRect.height / GRID_SIZE;

      const col = Math.floor((x - boardRect.left) / cellWidth);
      const row = Math.floor((targetY - boardRect.top) / cellHeight);

      if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
        return { row, col };
      }
      return null;
    }

    function updatePlacementPreview(x, y) {
      clearHighlights();
      if (!activeDrag) return;

      const pos = getGridCellFromPoint(x, y);
      if (!pos) return;

      // Center the shape on finger
      const startR = pos.row - Math.floor(activeDrag.rows / 2);
      const startC = pos.col - Math.floor(activeDrag.cols / 2);

      if (canPlaceShape(activeDrag.item.matrix, startR, startC)) {
        highlightShape(activeDrag.item.matrix, startR, startC, true);
      }
    }

    function clearHighlights() {
      const cells = gridBoardEl.children;
      for (let i = 0; i < cells.length; i++) {
        cells[i].classList.remove('highlight');
      }
    }

    function highlightShape(matrix, startR, startC, valid) {
      const cells = gridBoardEl.children;
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
          if (matrix[r][c]) {
            const gridR = startR + r;
            const gridC = startC + c;
            if (gridR >= 0 && gridR < GRID_SIZE && gridC >= 0 && gridC < GRID_SIZE) {
              const idx = gridR * GRID_SIZE + gridC;
              cells[idx].classList.add('highlight');
            }
          }
        }
      }
    }

    function onPointerUp(e) {
      if (!activeDrag) return;

      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);

      const pos = getGridCellFromPoint(e.clientX, e.clientY);
      let placed = false;

      if (pos) {
        const startR = pos.row - Math.floor(activeDrag.rows / 2);
        const startC = pos.col - Math.floor(activeDrag.cols / 2);

        if (canPlaceShape(activeDrag.item.matrix, startR, startC)) {
          placeShape(activeDrag.item, startR, startC);
          hand[activeDrag.slotIndex] = null;
          placed = true;
          sound.playPlace();
        }
      }

      activeDrag.element.remove();
      if (!placed) {
        activeDrag.source.style.opacity = '1';
      }
      activeDrag = null;
      clearHighlights();

      if (placed) {
        // If all 3 blocks used, spawn 3 more!
        if (hand.every(h => h === null)) {
          spawnHand();
        } else {
          renderHand();
          checkGameOver();
        }
      }
    }

    function canPlaceShape(matrix, startR, startC) {
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
          if (matrix[r][c]) {
            const gr = startR + r;
            const gc = startC + c;
            if (gr < 0 || gr >= GRID_SIZE || gc < 0 || gc >= GRID_SIZE) return false;
            if (board[gr][gc] !== null) return false;
          }
        }
      }
      return true;
    }

    function placeShape(item, startR, startC) {
      let blockCount = 0;
      for (let r = 0; r < item.matrix.length; r++) {
        for (let c = 0; c < item.matrix[0].length; c++) {
          if (item.matrix[r][c]) {
            board[startR + r][startC + c] = {
              color: item.color,
              isBomb: item.isBomb
            };
            blockCount++;
          }
        }
      }

      addScore(blockCount * 10);
      renderBoard();
      checkLineClears();
    }

    // --- Line Clears & Elemental Bomb Blast ---
    function checkLineClears() {
      const fullRows = [];
      const fullCols = [];

      for (let r = 0; r < GRID_SIZE; r++) {
        if (board[r].every(cell => cell !== null)) fullRows.push(r);
      }
      for (let c = 0; c < GRID_SIZE; c++) {
        let full = true;
        for (let r = 0; r < GRID_SIZE; r++) {
          if (board[r][c] === null) { full = false; break; }
        }
        if (full) fullCols.push(c);
      }

      const totalLines = fullRows.length + fullCols.length;
      if (totalLines > 0) {
        combo++;
        sound.playClear(combo);
        triggerScreenShake();
        showComboEffect(combo, totalLines);

        const cellsToClear = new Set();
        let bombTriggered = false;
        const bombCenters = [];

        fullRows.forEach(r => {
          for (let c = 0; c < GRID_SIZE; c++) {
            cellsToClear.add(`${r},${c}`);
            if (board[r][c] && board[r][c].isBomb) {
              bombTriggered = true;
              bombCenters.push({ r, c });
            }
          }
        });

        fullCols.forEach(c => {
          for (let r = 0; r < GRID_SIZE; r++) {
            cellsToClear.add(`${r},${c}`);
            if (board[r][c] && board[r][c].isBomb) {
              bombTriggered = true;
              bombCenters.push({ r, c });
            }
          }
        });

        // 🧨 Elemental Bomb Blast: Explodes 3x3 surrounding cells!
        if (bombTriggered) {
          sound.playBomb();
          bombCenters.forEach(({ r, c }) => {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                  cellsToClear.add(`${nr},${nc}`);
                }
              }
            }
          });
        }

        // Animate Clears
        const cells = gridBoardEl.children;
        cellsToClear.forEach(coord => {
          const [r, c] = coord.split(',').map(Number);
          const idx = r * GRID_SIZE + c;
          cells[idx].classList.add('clearing');
        });

        const points = (cellsToClear.size * 20) * (combo * 1.5);
        addScore(Math.round(points));
        addFever(totalLines * 25 + (bombTriggered ? 30 : 0));

        setTimeout(() => {
          cellsToClear.forEach(coord => {
            const [r, c] = coord.split(',').map(Number);
            board[r][c] = null;
          });
          renderBoard();
          checkGameOver();
        }, 300);
      } else {
        combo = 0; // combo break if no lines cleared
      }
    }

    function showComboEffect(comboCount, lines) {
      const banner = document.createElement('div');
      banner.className = 'combo-banner absolute font-black tracking-tight text-center pointer-events-none drop-shadow-xl z-20';
      
      let title = `COMBO x${comboCount}!`;
      let colorClass = 'text-amber-400 text-3xl';
      if (comboCount >= 3) { title = `AMAZING! x${comboCount}`; colorClass = 'text-rose-400 text-4xl'; }
      if (comboCount >= 5) { title = `UNBELIEVABLE! x${comboCount}`; colorClass = 'text-cyan-400 text-5xl'; }

      banner.innerHTML = `<span class="${colorClass} block">${title}</span><span class="text-xs text-slate-300 font-bold uppercase tracking-widest">+${lines} LINES CLEARED</span>`;
      banner.style.left = '50%';
      banner.style.top = '50%';
      comboOverlay.appendChild(banner);

      setTimeout(() => banner.remove(), 800);
    }

    function triggerScreenShake() {
      boardContainer.classList.add('shake');
      setTimeout(() => boardContainer.classList.remove('shake'), 250);
    }

    function addScore(pts) {
      score += pts;
      currentScoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('block_blast_best', bestScore);
      }
    }

    function addFever(amount) {
      fever = Math.min(100, fever + amount);
      feverBarEl.style.width = `${fever}%`;
      if (fever >= 100) {
        hammerCount++;
        fever = 0;
        feverBarEl.style.width = '0%';
        updateSkillBadges();
      }
    }

    function updateSkillBadges() {
      hammerBadgeEl.textContent = hammerCount;
      btnHammer.classList.toggle('ring-2', hammerCount > 0);
      btnHammer.classList.toggle('ring-amber-400', hammerCount > 0);
    }

    // --- Skills: Hammer & Rotate ---
    btnHammer.addEventListener('click', () => {
      if (hammerCount <= 0) return;
      isHammerActive = !isHammerActive;
      btnHammer.classList.toggle('bg-amber-600', isHammerActive);
      gridBoardEl.classList.toggle('cursor-crosshair', isHammerActive);
    });

    function onCellClick(r, c) {
      if (isHammerActive && hammerCount > 0) {
        if (board[r][c] !== null) {
          board[r][c] = null;
          sound.playBomb();
          triggerScreenShake();
          hammerCount--;
          isHammerActive = false;
          btnHammer.classList.remove('bg-amber-600');
          gridBoardEl.classList.remove('cursor-crosshair');
          updateSkillBadges();
          renderBoard();
          checkGameOver();
        }
      }
    }

    btnRotate.addEventListener('click', () => {
      // Rotate all blocks in hand 90 degrees clockwise
      hand.forEach(item => {
        if (item) {
          item.matrix = rotateMatrix(item.matrix);
        }
      });
      sound.playPickup();
      renderHand();
      checkGameOver();
    });

    function rotateMatrix(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const result = Array(cols).fill(null).map(() => Array(rows).fill(0));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          result[c][rows - 1 - r] = matrix[r][c];
        }
      }
      return result;
    }

    // --- Game Over Check ---
    function checkGameOver() {
      let anyCanBePlaced = false;

      for (let i = 0; i < 3; i++) {
        const item = hand[i];
        if (item) {
          if (canItemFitAnywhere(item.matrix)) {
            anyCanBePlaced = true;
            break;
          }
        }
      }

      if (!anyCanBePlaced && hand.some(h => h !== null)) {
        setTimeout(showGameOver, 400);
      }
    }

    function canItemFitAnywhere(matrix) {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (canPlaceShape(matrix, r, c)) return true;
        }
      }
      return false;
    }

    function showGameOver() {
      modalFinalScore.textContent = score;
      modalBestScore.textContent = bestScore;
      gameOverModal.classList.remove('hidden');
    }

    btnRestart.addEventListener('click', () => {
      board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
      hand = [null, null, null];
      score = 0;
      combo = 0;
      fever = 0;
      hammerCount = 1;
      isHammerActive = false;
      currentScoreEl.textContent = '0';
      feverBarEl.style.width = '0%';
      updateSkillBadges();
      gameOverModal.classList.add('hidden');
      initBoardUI();
      spawnHand();
    });

    // Start Game
    initBoardUI();
    spawnHand();
    updateSkillBadges();
  </script>
</body>
</html>
