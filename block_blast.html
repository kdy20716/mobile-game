<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast: Elemental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Jua', -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #25284B 0%, #15162A 60%, #0F101F 100%);
    }
    .text-shadow-cute {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
    }
    .grid-cell {
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .grid-cell.highlight {
      background-color: rgba(255, 255, 255, 0.45) !important;
      transform: scale(0.94);
    }
    .grid-cell.clearing {
      animation: clearPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes clearPop {
      0% { transform: scale(1); filter: brightness(2); }
      40% { transform: scale(1.35) rotate(10deg); filter: brightness(2.5); }
      100% { transform: scale(0) rotate(-15deg); opacity: 0; }
    }
    .combo-banner {
      animation: comboFloat 0.8s ease-out forwards;
    }
    @keyframes comboFloat {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      70% { transform: translate(-50%, -60%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -80%) scale(0.9); opacity: 0; }
    }
    .shake {
      animation: shakeScreen 0.25s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shakeScreen {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }
    .dragged-item {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    }
    /* 3D Glossy Jelly Buttons */
    .jelly-btn-pink {
      background: linear-gradient(180deg, #FF78A5 0%, #E83E72 55%, #BD2050 100%);
      box-shadow: 0 4px 0 #851034, 0 8px 18px rgba(232, 62, 114, 0.4);
      border-top: 1.5px solid rgba(255, 255, 255, 0.65);
    }
    .jelly-btn-pink:active {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 1px 0 #851034, 0 4px 10px rgba(232, 62, 114, 0.3);
    }
    .jelly-btn-teal {
      background: linear-gradient(180deg, #3CE8BA 0%, #16B88B 55%, #0B8563 100%);
      box-shadow: 0 4px 0 #054D38, 0 8px 18px rgba(22, 184, 139, 0.4);
      border-top: 1.5px solid rgba(255, 255, 255, 0.65);
    }
    .jelly-btn-teal:active {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 1px 0 #054D38, 0 4px 10px rgba(22, 184, 139, 0.3);
    }
    .jelly-panel {
      background: rgba(34, 37, 63, 0.94);
      border: 2px solid rgba(85, 96, 150, 0.55);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.15);
    }
    .jelly-score-box {
      background: rgba(20, 22, 38, 0.88);
      border: 1.5px solid rgba(68, 78, 125, 0.6);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 select-none">

  <!-- Header: Score & Best Score & Skills -->
  <header class="w-full max-w-md flex flex-col gap-2 pt-2">
    <div class="flex items-center justify-between px-2">
      <!-- Score Box -->
      <div class="jelly-score-box rounded-2xl px-4 py-2 flex flex-col items-center min-w-[90px]">
        <span class="text-xs text-cyan-200 tracking-wider">SCORE</span>
        <span id="currentScore" class="text-3xl font-black text-amber-300 drop-shadow text-shadow-cute">0</span>
      </div>
      
      <!-- Logo -->
      <div class="text-center">
        <h1 class="text-2xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-pink-300 to-amber-300 drop-shadow">
          BLOCK BLAST
        </h1>
        <span class="text-xs tracking-widest text-pink-300 font-bold drop-shadow">✨ E L E M E N T A L ✨</span>
      </div>

      <!-- Best Box -->
      <div class="jelly-score-box rounded-2xl px-4 py-2 flex flex-col items-center min-w-[90px]">
        <span class="text-xs text-cyan-200 tracking-wider">BEST</span>
        <span id="bestScore" class="text-3xl font-black text-slate-100 text-shadow-cute">0</span>
      </div>
    </div>

    <!-- Skills Bar (3D Jelly Capsule Buttons) -->
    <div class="flex items-center justify-between jelly-panel rounded-2xl px-4 py-2.5 mt-1 shadow-lg">
      <div class="flex items-center gap-2">
        <span class="text-xs text-amber-300 text-shadow-cute">FEVER</span>
        <div class="w-28 h-4 bg-[#141526] rounded-full overflow-hidden p-0.5 border border-slate-700 shadow-inner">
          <div id="feverBar" class="h-full bg-gradient-to-r from-pink-400 to-amber-400 rounded-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Skip Skill (3D Glossy Jelly Button) -->
        <button id="btnSkip" class="jelly-btn-pink relative px-3.5 py-1.5 rounded-xl text-white flex items-center gap-1.5 transition-all">
          <span class="text-base">🎲</span>
          <span class="text-sm font-bold text-shadow-cute">스킵</span>
          <span id="skipBadge" class="absolute -top-2 -right-2 px-1.5 py-0.5 bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 text-[10px] font-black rounded-full border border-white shadow-md">READY</span>
        </button>
        <!-- Rotate Skill (3D Glossy Jelly Button) -->
        <button id="btnRotate" class="jelly-btn-teal px-3.5 py-1.5 rounded-xl text-white flex items-center gap-1.5 transition-all">
          <span class="text-base">🔄</span>
          <span class="text-sm font-bold text-shadow-cute">돌리기</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Game Board Container (Cute Jelly Tray) -->
  <main id="boardContainer" class="relative w-full max-w-md aspect-square p-3 jelly-panel rounded-3xl shadow-2xl flex items-center justify-center my-auto">
    <div id="gridBoard" class="w-full h-full grid grid-cols-8 grid-rows-8 gap-1.5 p-2 bg-[#141526] rounded-2xl border border-slate-800/80 shadow-inner">
      <!-- 64 cells generated by JS -->
    </div>

    <!-- Combo Popup Overlay -->
    <div id="comboOverlay" class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden"></div>
  </main>

  <!-- Bottom: 3 Hand Blocks -->
  <footer class="w-full max-w-md pb-4 pt-1">
    <div id="handSlots" class="grid grid-cols-3 gap-3 h-28 items-center justify-items-center jelly-panel rounded-2xl p-2.5 shadow-lg">
      <!-- 3 Draggable Blocks will be rendered here -->
    </div>
    <div class="text-center mt-2.5">
      <span class="text-xs font-bold text-slate-300 drop-shadow">✨ 블록을 쏙! 넣어 라인을 팡팡 터뜨려요 💖 (🧨폭탄 3x3 연쇄 폭발)</span>
    </div>
  </footer>

  <!-- Game Over Modal -->
  <div id="gameOverModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="jelly-panel rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl animate-fade-in border-2 border-pink-500/40">
      <div class="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 border border-rose-400/40 shadow-lg">
        💥
      </div>
      <h2 class="text-2xl font-black text-slate-100 text-shadow-cute">NO MORE MOVES</h2>
      <p class="text-xs text-slate-300 mt-1 mb-5">더 이상 블록을 둘 곳이 없습니다!</p>

      <div class="jelly-score-box rounded-2xl p-4 mb-6 flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-cyan-200">FINAL SCORE</span>
          <span id="modalFinalScore" class="text-3xl font-black text-amber-300 text-shadow-cute">0</span>
        </div>
        <div class="flex justify-between items-center border-t border-slate-700/80 pt-2">
          <span class="text-xs font-bold text-slate-400">BEST RECORD</span>
          <span id="modalBestScore" class="text-xl font-black text-slate-200 text-shadow-cute">0</span>
        </div>
      </div>

      <button id="btnRestart" class="jelly-btn-pink w-full py-3.5 text-white font-black text-lg rounded-2xl transition-all">
        한 번 더 하기 ✨
      </button>
    </div>
  </div>

  <!-- Audio Synthesis & Game Logic Script -->
  <script>
    // --- Procedural ASMR Web Audio Engine ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.kalimbaNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      // 🫧 ASMR: Water Bubble Pop
      playPickup() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      // 🪵 ASMR: Soft Jelly Tap
      playPlace() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      // 🔔 ASMR: Kalimba Melodic Chimes
      playClear(comboCount = 1) {
        this.init();
        if (!this.ctx) return;
        try {
          const note = this.kalimbaNotes[Math.min(comboCount - 1, this.kalimbaNotes.length - 1)];
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.35);

          // Harmonic chime overtone
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(note * 2.76, this.ctx.currentTime);
          gain2.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start();
          osc2.stop(this.ctx.currentTime + 0.25);
        } catch (e) {}
      }
      // 🎉 ASMR: Party Popper & Bubble Burst
      playBomb() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(380, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.28);
        } catch (e) {}
      }
      // 🔨 ASMR: Squeaky Toy Hammer "뾱!"
      playHammer() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(850, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(1350, this.ctx.currentTime + 0.07);
          osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.14);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.14);
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    // --- Sweet Macaron & Pastel Jelly Color Palette ---
    const COLORS = [
      { bg: '#5CC4FF', border: '#38A7E8' }, // Sky Milk Blue
      { bg: '#FFC043', border: '#EAA522' }, // Mango Sorbet Yellow
      { bg: '#4EE0B5', border: '#2DC295' }, // Apple Soda Mint
      { bg: '#FF7AA2', border: '#E85B85' }, // Strawberry Milk Pink
      { bg: '#A67CFF', border: '#8A59EE' }, // Berry Lavender Purple
      { bg: '#FF8F6B', border: '#E86E47' }, // Peach Coral Orange
      { bg: '#FF4D69', border: '#E02A48' }, // Sweet Cherry Red (Bomb)
    ];

    const SHAPES = [
      // 1x1 Dot
      { matrix: [[1]], name: 'dot' },
      // Bars (2, 3, 4, 5)
      { matrix: [[1, 1]], name: 'bar2' },
      { matrix: [[1], [1]], name: 'bar2_v' },
      { matrix: [[1, 1, 1]], name: 'bar3' },
      { matrix: [[1], [1], [1]], name: 'bar3_v' },
      { matrix: [[1, 1, 1, 1]], name: 'bar4' },
      { matrix: [[1], [1], [1], [1]], name: 'bar4_v' },
      // Squares
      { matrix: [[1, 1], [1, 1]], name: 'sq2' },
      { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], name: 'sq3' },
      // Corners
      { matrix: [[1, 1], [1, 0]], name: 'corner1' },
      { matrix: [[1, 1], [0, 1]], name: 'corner2' },
      { matrix: [[1, 0], [1, 1]], name: 'corner3' },
      { matrix: [[0, 1], [1, 1]], name: 'corner4' },
      // Large L
      { matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], name: 'L_large' },
      { matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], name: 'J_large' },
      // T Shapes
      { matrix: [[1, 1, 1], [0, 1, 0]], name: 'T' },
      { matrix: [[0, 1, 0], [1, 1, 1]], name: 'T_inv' },
    ];

    // --- Game State Variables ---
    const GRID_SIZE = 8;
    let board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
    let hand = [null, null, null];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('block_blast_best') || '0', 10);
    let combo = 0;
    let fever = 0;
    let isSkipReady = true;
    let skipRequiredLines = 10;
    let skipCurrentLines = 0;

    // --- DOM Elements ---
    const gridBoardEl = document.getElementById('gridBoard');
    const handSlotsEl = document.getElementById('handSlots');
    const currentScoreEl = document.getElementById('currentScore');
    const bestScoreEl = document.getElementById('bestScore');
    const feverBarEl = document.getElementById('feverBar');
    const skipBadgeEl = document.getElementById('skipBadge');
    const btnSkip = document.getElementById('btnSkip');
    const btnRotate = document.getElementById('btnRotate');
    const gameOverModal = document.getElementById('gameOverModal');
    const modalFinalScore = document.getElementById('modalFinalScore');
    const modalBestScore = document.getElementById('modalBestScore');
    const btnRestart = document.getElementById('btnRestart');
    const comboOverlay = document.getElementById('comboOverlay');
    const boardContainer = document.getElementById('boardContainer');

    bestScoreEl.textContent = bestScore;

    // --- Initialize 8x8 Board UI ---
    function initBoardUI() {
      gridBoardEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell rounded-md bg-slate-900 border border-slate-800/80 flex items-center justify-center cursor-pointer select-none';
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          cell.addEventListener('click', () => onCellClick(r, c));
          gridBoardEl.appendChild(cell);
        }
      }
      renderBoard();
    }

    function renderBoard() {
      const cells = gridBoardEl.children;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const idx = r * GRID_SIZE + c;
          const cell = cells[idx];
          const data = board[r][c];

          if (data) {
            cell.style.backgroundColor = data.color.bg;
            cell.style.borderColor = data.color.border;
            cell.innerHTML = data.isBomb ? '<span class="text-xs">🧨</span>' : '';
          } else {
            cell.style.backgroundColor = '';
            cell.style.borderColor = '';
            cell.innerHTML = '';
          }
          cell.classList.remove('highlight', 'clearing');
        }
      }
    }

    // --- Spawn Hand Blocks ---
    function spawnHand() {
      for (let i = 0; i < 3; i++) {
        if (!hand[i]) {
          const shapeProto = SHAPES[Math.floor(Math.random() * SHAPES.length)];
          const color = COLORS[Math.floor(Math.random() * (COLORS.length - 1))];
          
          // 15% chance to be an Elemental Bomb block!
          const isBomb = Math.random() < 0.15;
          const blockColor = isBomb ? COLORS[COLORS.length - 1] : color;

          hand[i] = {
            matrix: shapeProto.matrix.map(row => [...row]),
            color: blockColor,
            isBomb: isBomb
          };
        }
      }
      renderHand();
      checkGameOver();
    }

    function renderHand() {
      handSlotsEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const slot = document.createElement('div');
        slot.className = 'w-full h-full flex items-center justify-center relative';

        const item = hand[i];
        if (item) {
          const blockEl = createBlockElement(item, i);
          slot.appendChild(blockEl);
        }
        handSlotsEl.appendChild(slot);
      }
    }

    function createBlockElement(item, slotIndex) {
      const rows = item.matrix.length;
      const cols = item.matrix[0].length;

      const container = document.createElement('div');
      container.className = 'cursor-grab active:cursor-grabbing p-1 transition-transform hover:scale-105';
      container.style.display = 'grid';
      container.style.gridTemplateRows = `repeat(${rows}, 20px)`;
      container.style.gridTemplateColumns = `repeat(${cols}, 20px)`;
      container.style.gap = '2.5px';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const bit = item.matrix[r][c];
          const cell = document.createElement('div');
          if (bit) {
            cell.className = 'rounded-md shadow-sm flex items-center justify-center text-[10px]';
            cell.style.backgroundColor = item.color.bg;
            cell.style.border = `1.5px solid ${item.color.border}`;
            if (item.isBomb && r === 0 && c === 0) cell.textContent = '🧨';
          } else {
            cell.style.opacity = '0';
          }
          container.appendChild(cell);
        }
      }

      setupDragAndDrop(container, item, slotIndex);
      return container;
    }

    // --- Drag & Drop Mechanics (Mobile & Mouse) ---
    let activeDrag = null;

    function setupDragAndDrop(element, item, slotIndex) {
      element.addEventListener('pointerdown', (e) => {
        if (isHammerActive) return;
        e.preventDefault();
        sound.playPickup();

        const rect = element.getBoundingClientRect();
        const clone = element.cloneNode(true);
        clone.classList.add('dragged-item');
        document.body.appendChild(clone);

        // Adjust scale for visual clarity during drag
        clone.style.transform = 'translate(-50%, -75%) scale(1.15)';

        activeDrag = {
          element: clone,
          source: element,
          item: item,
          slotIndex: slotIndex,
          rows: item.matrix.length,
          cols: item.matrix[0].length
        };

        element.style.opacity = '0.2';
        updateDragPosition(e.clientX, e.clientY);

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      });
    }

    function onPointerMove(e) {
      if (!activeDrag) return;
      updateDragPosition(e.clientX, e.clientY);
      updatePlacementPreview(e.clientX, e.clientY);
    }

    function updateDragPosition(x, y) {
      if (!activeDrag) return;
      // -50px touch offset so finger never covers the block!
      activeDrag.element.style.left = `${x}px`;
      activeDrag.element.style.top = `${y - 50}px`;
    }

    function getGridCellFromPoint(x, y) {
      const targetY = y - 50; // match touch offset
      const boardRect = gridBoardEl.getBoundingClientRect();

      if (x < boardRect.left || x > boardRect.right || targetY < boardRect.top || targetY > boardRect.bottom) {
        return null;
      }

      const cellWidth = boardRect.width / GRID_SIZE;
      const cellHeight = boardRect.height / GRID_SIZE;

      const col = Math.floor((x - boardRect.left) / cellWidth);
      const row = Math.floor((targetY - boardRect.top) / cellHeight);

      if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
        return { row, col };
      }
      return null;
    }

    function updatePlacementPreview(x, y) {
      clearHighlights();
      if (!activeDrag) return;

      const pos = getGridCellFromPoint(x, y);
      if (!pos) return;

      // Center the shape on finger
      const startR = pos.row - Math.floor(activeDrag.rows / 2);
      const startC = pos.col - Math.floor(activeDrag.cols / 2);

      if (canPlaceShape(activeDrag.item.matrix, startR, startC)) {
        highlightShape(activeDrag.item.matrix, startR, startC, true);
      }
    }

    function clearHighlights() {
      const cells = gridBoardEl.children;
      for (let i = 0; i < cells.length; i++) {
        cells[i].classList.remove('highlight');
      }
    }

    function highlightShape(matrix, startR, startC, valid) {
      const cells = gridBoardEl.children;
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
          if (matrix[r][c]) {
            const gridR = startR + r;
            const gridC = startC + c;
            if (gridR >= 0 && gridR < GRID_SIZE && gridC >= 0 && gridC < GRID_SIZE) {
              const idx = gridR * GRID_SIZE + gridC;
              cells[idx].classList.add('highlight');
            }
          }
        }
      }
    }

    function onPointerUp(e) {
      if (!activeDrag) return;

      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);

      const pos = getGridCellFromPoint(e.clientX, e.clientY);
      let placed = false;

      if (pos) {
        const startR = pos.row - Math.floor(activeDrag.rows / 2);
        const startC = pos.col - Math.floor(activeDrag.cols / 2);

        if (canPlaceShape(activeDrag.item.matrix, startR, startC)) {
          placeShape(activeDrag.item, startR, startC);
          hand[activeDrag.slotIndex] = null;
          placed = true;
          sound.playPlace();
        }
      }

      activeDrag.element.remove();
      if (!placed) {
        activeDrag.source.style.opacity = '1';
      }
      activeDrag = null;
      clearHighlights();

      if (placed) {
        // If all 3 blocks used, spawn 3 more!
        if (hand.every(h => h === null)) {
          spawnHand();
        } else {
          renderHand();
          checkGameOver();
        }
      }
    }

    function canPlaceShape(matrix, startR, startC) {
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
          if (matrix[r][c]) {
            const gr = startR + r;
            const gc = startC + c;
            if (gr < 0 || gr >= GRID_SIZE || gc < 0 || gc >= GRID_SIZE) return false;
            if (board[gr][gc] !== null) return false;
          }
        }
      }
      return true;
    }

    function placeShape(item, startR, startC) {
      let blockCount = 0;
      for (let r = 0; r < item.matrix.length; r++) {
        for (let c = 0; c < item.matrix[0].length; c++) {
          if (item.matrix[r][c]) {
            board[startR + r][startC + c] = {
              color: item.color,
              isBomb: item.isBomb
            };
            blockCount++;
          }
        }
      }

      addScore(blockCount * 10);
      renderBoard();
      checkLineClears();
    }

    // --- Line Clears & Elemental Bomb Blast ---
    function checkLineClears() {
      const fullRows = [];
      const fullCols = [];

      for (let r = 0; r < GRID_SIZE; r++) {
        if (board[r].every(cell => cell !== null)) fullRows.push(r);
      }
      for (let c = 0; c < GRID_SIZE; c++) {
        let full = true;
        for (let r = 0; r < GRID_SIZE; r++) {
          if (board[r][c] === null) { full = false; break; }
        }
        if (full) fullCols.push(c);
      }

      const totalLines = fullRows.length + fullCols.length;
      if (totalLines > 0) {
        combo++;
        sound.playClear(combo);
        triggerScreenShake();
        showComboEffect(combo, totalLines);

        const cellsToClear = new Set();
        let bombTriggered = false;
        const bombCenters = [];

        fullRows.forEach(r => {
          for (let c = 0; c < GRID_SIZE; c++) {
            cellsToClear.add(`${r},${c}`);
            if (board[r][c] && board[r][c].isBomb) {
              bombTriggered = true;
              bombCenters.push({ r, c });
            }
          }
        });

        fullCols.forEach(c => {
          for (let r = 0; r < GRID_SIZE; r++) {
            cellsToClear.add(`${r},${c}`);
            if (board[r][c] && board[r][c].isBomb) {
              bombTriggered = true;
              bombCenters.push({ r, c });
            }
          }
        });

        // 🧨 Elemental Bomb Blast: Explodes 3x3 surrounding cells!
        if (bombTriggered) {
          sound.playBomb();
          bombCenters.forEach(({ r, c }) => {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                  cellsToClear.add(`${nr},${nc}`);
                }
              }
            }
          });
        }

        // Animate Clears & Sparkle Particles
        const cells = gridBoardEl.children;
        cellsToClear.forEach(coord => {
          const [r, c] = coord.split(',').map(Number);
          const idx = r * GRID_SIZE + c;
          const cellEl = cells[idx];
          cellEl.classList.add('clearing');
          if (board[r][c] && board[r][c].color) {
            spawnSparkleParticles(cellEl, board[r][c].color.bg);
          }
        });

        const points = (cellsToClear.size * 20) * (combo * 1.5);
        addScore(Math.round(points));
        addFever(totalLines * 25 + (bombTriggered ? 30 : 0));

        // Progressive Skip Cooldown Check (10 -> 20 -> 30...)
        if (!isSkipReady) {
          skipCurrentLines += totalLines;
          if (skipCurrentLines >= skipRequiredLines) {
            isSkipReady = true;
            skipCurrentLines = 0;
            skipRequiredLines += 10;
          }
          updateSkipUI();
        }

        setTimeout(() => {
          cellsToClear.forEach(coord => {
            const [r, c] = coord.split(',').map(Number);
            board[r][c] = null;
          });
          renderBoard();
          checkGameOver();
        }, 300);
      } else {
        combo = 0; // combo break if no lines cleared
      }
    }

    function spawnSparkleParticles(cellEl, color) {
      const rect = cellEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dirs = [
        { x: 1, y: 1 }, { x: -1, y: 1 }, { x: -1, y: -1 }, { x: 1, y: -1 }
      ];

      dirs.forEach(d => {
        const p = document.createElement('div');
        p.className = 'fixed pointer-events-none rounded-full z-50 transition-all duration-300';
        p.style.width = '8px';
        p.style.height = '8px';
        p.style.backgroundColor = color || '#FF7AA2';
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        p.style.transform = 'translate(-50%, -50%) scale(1.2)';
        p.style.boxShadow = `0 0 8px ${color || '#FF7AA2'}`;
        document.body.appendChild(p);

        requestAnimationFrame(() => {
          const dist = 28 + Math.random() * 24;
          p.style.transform = `translate(${d.x * dist - 4}px, ${d.y * dist - 4}px) scale(0)`;
          p.style.opacity = '0';
        });

        setTimeout(() => p.remove(), 350);
      });
    }

    function showComboEffect(comboCount, lines) {
      const banner = document.createElement('div');
      banner.className = 'combo-banner absolute font-black tracking-tight text-center pointer-events-none drop-shadow-xl z-20';
      
      let title = `💖 COMBO x${comboCount}!`;
      let colorClass = 'text-pink-300 text-3xl';
      if (comboCount === 2) { title = `✨ SWEET! x2`; colorClass = 'text-amber-300 text-4xl'; }
      else if (comboCount === 3) { title = `🍓 DELICIOUS! x3`; colorClass = 'text-rose-300 text-4xl'; }
      else if (comboCount === 4) { title = `🌟 MARVELOUS! x4`; colorClass = 'text-emerald-300 text-5xl'; }
      else if (comboCount >= 5) { title = `🎉 UNBELIEVABLE! x${comboCount}`; colorClass = 'text-purple-300 text-5xl'; }

      banner.innerHTML = `<span class="${colorClass} block">${title}</span><span class="text-xs text-slate-300 font-bold uppercase tracking-widest">+${lines} LINES CLEARED</span>`;
      banner.style.left = '50%';
      banner.style.top = '50%';
      comboOverlay.appendChild(banner);

      setTimeout(() => banner.remove(), 800);
    }

    function triggerScreenShake() {
      boardContainer.classList.add('shake');
      setTimeout(() => boardContainer.classList.remove('shake'), 250);
    }

    function addScore(pts) {
      score += pts;
      currentScoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('block_blast_best', bestScore);
      }
    }

    function addFever(amount) {
      fever = Math.min(100, fever + amount);
      feverBarEl.style.width = `${fever}%`;
      if (fever >= 100) {
        addScore(500);
        fever = 0;
        feverBarEl.style.width = '0%';
      }
    }

    function updateSkipUI() {
      if (isSkipReady) {
        btnSkip.disabled = false;
        btnSkip.classList.remove('opacity-50', 'cursor-not-allowed');
        skipBadgeEl.textContent = 'READY';
        skipBadgeEl.className = 'absolute -top-1.5 -right-2 px-1.5 py-0.5 bg-emerald-400 text-slate-900 text-[10px] font-black rounded-full border border-white shadow';
      } else {
        btnSkip.disabled = true;
        btnSkip.classList.add('opacity-50', 'cursor-not-allowed');
        skipBadgeEl.textContent = `${skipCurrentLines}/${skipRequiredLines}`;
        skipBadgeEl.className = 'absolute -top-1.5 -right-2 px-1.5 py-0.5 bg-slate-700 text-amber-300 text-[10px] font-black rounded-full border border-slate-500 shadow';
      }
    }

    // --- Skills: Skip & Rotate ---
    btnSkip.addEventListener('click', () => {
      if (!isSkipReady) return;
      isSkipReady = false;
      skipCurrentLines = 0;
      updateSkipUI();
      sound.playPickup();
      hand = [null, null, null];
      spawnHand();
    });

    btnRotate.addEventListener('click', () => {
      // Rotate all blocks in hand 90 degrees clockwise
      hand.forEach(item => {
        if (item) {
          item.matrix = rotateMatrix(item.matrix);
        }
      });
      sound.playPickup();
      renderHand();
      checkGameOver();
    });

    function rotateMatrix(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const result = Array(cols).fill(null).map(() => Array(rows).fill(0));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          result[c][rows - 1 - r] = matrix[r][c];
        }
      }
      return result;
    }

    // --- Game Over Check with 4 Rotations ---
    function checkGameOver() {
      let anyCanBePlaced = false;

      for (let i = 0; i < 3; i++) {
        const item = hand[i];
        if (item) {
          if (canItemFitAnywhereWithRotation(item.matrix)) {
            anyCanBePlaced = true;
            break;
          }
        }
      }

      if (!anyCanBePlaced && hand.some(h => h !== null)) {
        setTimeout(showGameOver, 400);
      }
    }

    function canItemFitAnywhereWithRotation(matrix) {
      let curr = matrix;
      for (let rot = 0; rot < 4; rot++) {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (canPlaceShape(curr, r, c)) return true;
          }
        }
        curr = rotateMatrix(curr);
      }
      return false;
    }

    function showGameOver() {
      modalFinalScore.textContent = score;
      modalBestScore.textContent = bestScore;
      gameOverModal.classList.remove('hidden');
    }

    btnRestart.addEventListener('click', () => {
      board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
      hand = [null, null, null];
      score = 0;
      combo = 0;
      fever = 0;
      isSkipReady = true;
      skipRequiredLines = 10;
      skipCurrentLines = 0;
      currentScoreEl.textContent = '0';
      feverBarEl.style.width = '0%';
      updateSkipUI();
      gameOverModal.classList.add('hidden');
      initBoardUI();
      spawnHand();
    });

    // Start Game
    initBoardUI();
    spawnHand();
    updateSkipUI();
  </script>
</body>
</html>
